name: Deploy to CDN (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g. 1.1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '${{ inputs.version }}' — expected semver like 1.1.0"
            exit 1
          fi

      - name: Fetch package from npm
        run: |
          mkdir cdn
          cd cdn
          npm pack @devschile/chucao@${{ inputs.version }} --silent
          tar -xzf devschile-chucao-*.tgz

      - name: Deploy to CDN
        run: |
          aws --endpoint-url "$S3_ENDPOINT_URL" --region garage s3 sync cdn/package/dist/chucao "s3://$S3_BUCKET/chucao/${{ inputs.version }}/" \
            --exclude "*.map" --exclude "fonts/*" \
            --cache-control "public, max-age=31536000, immutable"
          aws --endpoint-url "$S3_ENDPOINT_URL" --region garage s3 sync cdn/package/dist/chucao "s3://$S3_BUCKET/chucao/latest/" \
            --exclude "*.map" --exclude "fonts/*" --delete \
            --cache-control "public, max-age=3600"
          aws --endpoint-url "$S3_ENDPOINT_URL" --region garage s3 rm "s3://$S3_BUCKET/chucao/latest/fonts/" --recursive
          aws --endpoint-url "$S3_ENDPOINT_URL" --region garage s3 sync cdn/package/dist/chucao/fonts "s3://$S3_BUCKET/chucao/fonts/" \
            --cache-control "public, max-age=31536000, immutable"
        env:
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: garage
          AWS_S3_ADDRESSING_STYLE: path
