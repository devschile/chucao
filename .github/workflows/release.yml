name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

      # `actions/setup-node` only writes a registry line into `.npmrc`; the
      # token still has to be written there explicitly, otherwise npm treats
      # the publish as anonymous and answers with an OTP challenge that a
      # non-interactive runner cannot satisfy.
      - name: Configure npm authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is empty or missing from the repository secrets"
            exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" >> "$HOME/.npmrc"
          echo "token length: ${#NODE_AUTH_TOKEN}"
          echo "token prefix: $(printf '%s' "$NODE_AUTH_TOKEN" | cut -c1-4)"
          echo "token has whitespace: $(printf '%s' "$NODE_AUTH_TOKEN" | grep -c '[[:space:]]')"
          npm config get registry
          npm whoami
        shell: bash

      - name: Publish to npm
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Deploy to CDN
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          sync_s3() {
            aws --endpoint-url "$S3_ENDPOINT_URL" --region garage s3 "$@"
          }
          sync_s3 sync dist/chucao "s3://$S3_BUCKET/chucao/$VERSION/" \
            --exclude "*.map" --exclude "fonts/*" \
            --cache-control "public, max-age=31536000, immutable"
          # `--delete` is deliberately absent: Garage rejects the signed DELETE
          # requests aws-cli sends ("signed header `content-length` is not
          # present"), which failed the whole step after a successful upload.
          # Stale hashed chunks left in `latest/` are unreachable, and the next
          # release rewrites the entry points, so they are harmless.
          sync_s3 sync dist/chucao "s3://$S3_BUCKET/chucao/latest/" \
            --exclude "*.map" --exclude "fonts/*" \
            --cache-control "public, max-age=3600"
          # No cleanup of `latest/fonts/`: it is a `cp` of this build's fonts, so
          # a stale file there can only be one this build also ships. Deleting it
          # needs Garage to accept DELETE, which it currently refuses.
          sync_s3 cp --recursive dist/chucao/fonts "s3://$S3_BUCKET/chucao/latest/fonts/" \
            --cache-control "public, max-age=3600"
          sync_s3 sync dist/chucao/fonts "s3://$S3_BUCKET/chucao/fonts/" \
            --cache-control "public, max-age=31536000, immutable"
        env:
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: garage
          AWS_S3_ADDRESSING_STYLE: path
