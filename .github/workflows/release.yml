name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

      - name: Publish to npm
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Deploy to CDN
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          aws --endpoint-url "$S3_ENDPOINT_URL" --region garage s3 sync dist/chucao "s3://$S3_BUCKET/chucao/$VERSION/" \
            --exclude "*.map" --exclude "fonts/*" \
            --cache-control "public, max-age=31536000, immutable"
          aws --endpoint-url "$S3_ENDPOINT_URL" --region garage s3 sync dist/chucao "s3://$S3_BUCKET/chucao/latest/" \
            --exclude "*.map" --exclude "fonts/*" --delete \
            --cache-control "public, max-age=3600"
          aws --endpoint-url "$S3_ENDPOINT_URL" --region garage s3 rm "s3://$S3_BUCKET/chucao/latest/fonts/" --recursive
          aws --endpoint-url "$S3_ENDPOINT_URL" --region garage s3 sync dist/chucao/fonts "s3://$S3_BUCKET/chucao/fonts/" \
            --cache-control "public, max-age=31536000, immutable"
        env:
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: garage
          AWS_S3_ADDRESSING_STYLE: path
