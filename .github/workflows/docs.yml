name: Publish docs site

on:
  push:
    branches:
      - main
    paths:
      - 'docs-site/**'
      - 'docs/**'
      - 'src/**'
      - 'assets/**'
      - 'README.md'
      - 'DESIGN.md'
      - 'CHANGELOG.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Generate gallery
        run: pnpm run generate:gallery

      # The gallery documents every component on the next main push, but the
      # site loads the library from the CDN chucao/latest/, which only updates
      # on a release. Fail the publish when the gallery would reference a
      # component or prop the release does not carry yet, so the live site
      # keeps the last consistent version instead of a broken section.
      - name: Check gallery components are released
        run: pnpm run check:released

      - name: Assemble publish dir
        run: |
          rm -rf publish
          mkdir -p publish
          cp -R docs-site/. publish/
          cp README.md DESIGN.md CHANGELOG.md publish/
          cp -R docs publish/docs

      - name: Upload publish dir
        uses: actions/upload-artifact@v7
        with:
          name: docs-publish
          path: publish
          if-no-files-found: error

  publish-pages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download publish dir
        uses: actions/download-artifact@v8
        with:
          name: docs-publish
          path: publish

      - name: Deploy to docs branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan docs-publish
          git rm -rf . >/dev/null 2>&1 || true
          cp -R publish/. .
          rm -rf publish
          git add -A
          git commit -m "docs: publish site from main [skip ci]"
          git push -f origin docs-publish:docs

  deploy-gallery:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download publish dir
        uses: actions/download-artifact@v8
        with:
          name: docs-publish
          path: publish

      - name: Deploy to CDN gallery
        run: |
          aws --endpoint-url "$S3_ENDPOINT_URL" --region garage s3 sync publish "s3://$S3_BUCKET/gallery/latest/" \
            --delete \
            --cache-control "public, max-age=3600"
        env:
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: garage
          AWS_S3_ADDRESSING_STYLE: path
